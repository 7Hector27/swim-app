name: Dev Migrations

# Runs database migrations and the skills-catalog sync against the hosted
# dev Supabase project on every push to `dev`. Prod migrations stay manual —
# this workflow intentionally does not fire on `main`. See docs/deployment.md.

on:
  push:
    branches: [dev]

concurrency:
  group: dev-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations and sync catalog
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Sync skills catalog
        run: pnpm db:sync-catalog
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
