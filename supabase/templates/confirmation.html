<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Confirm your JG Swim account</title>
  </head>
  <body style="font-family: sans-serif; color: #082c4f; max-width: 480px; margin: 0 auto; padding: 32px 24px;">
    <h2 style="margin-bottom: 8px;">Confirm your JG Swim account</h2>
    <p>Click the link below to confirm your email address and activate your account.</p>
    <p style="margin: 24px 0;">
      <!--
        emailRedirectTo is always set in the API to either:
          /auth/confirm?returnTo=<encoded>   (invite signup)
          /auth/confirm?                     (normal signup, trailing ? so &token_hash appends cleanly)
        .RedirectTo is therefore always the correct base; append &token_hash and &type directly.
      -->
      <a
        href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
        style="background: #082c4f; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: bold; display: inline-block;"
      >
        Confirm email address
      </a>
    </p>
    <p style="color: #2e4a66; font-size: 0.875rem;">
      If you did not create a JG Swim account, you can safely ignore this email.
    </p>
  </body>
</html>
