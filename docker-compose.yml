services:
  postgres:
    image: postgres:17-alpine
    container_name: swim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swim
      POSTGRES_PASSWORD: swim
      POSTGRES_DB: swim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swim -d swim"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
